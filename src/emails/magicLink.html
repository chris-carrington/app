<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, Helvetica, sans-serif;">

  <!-- body -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f4f4;">
    <tr>
      <td align="center" style="padding: 21px 15px;">

        <!-- wrapper -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 690px; background-color: #ffffff; border-radius: 8px; box-shadow: 0px 5px 18px -1px rgba(0,0,0,0.18);">

          <!-- nav / header -->
          <tr>
            <td style="padding: 15px;">
              <img src="https://shastatrades.org/img/logo.png" alt="Shasta Trades Logo" width="45" height="45"
                style="display: inline-block; vertical-align: middle; width: 45px; height: 45px; margin-right: 9px;">
              <span style="font-size: 21px; font-weight: 600; color: #1b3022; vertical-align: middle;">
                Sign In
              </span>
            </td>
          </tr>

          <!-- divider -->
          <tr>
            <td style="border-top: 1px solid #e2e8f0;"></td>
          </tr>

          <!-- greeting -->
          <tr>
            <td style="padding: 15px 15px 9px 15px; margin-bottom: 9px; font-size: 18px; color: #333333; line-height: 1.6;">
              Hi <strong><!-- add: firstName --> <!-- add: lastName --></strong>,
            </td>
          </tr>

          <!-- directions -->
          <tr>
            <td style="padding: 0 15px 24px 15px; font-size: 18px; color: #333333; line-height: 1.6;">
              Please click the button below to sign in to your Shasta Trades account!
            </td>
          </tr>

          <!-- button -->
          <tr>
            <td style="padding: 0 15px 20px 15px;">
              <a
                target="_blank"
                href="<!-- add: magicLink -->"
                style="display: inline-block; color: #F9FBF9; font-size: 18px; font-weight: 500; text-decoration: none; text-align: center; background-color: #1b3022; border-radius: 4.5px; padding: 9px; width: 100%; box-sizing: border-box;">
                Sign In
              </a>
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td
              style="padding: 15px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 16px; color: #888888; line-height: 1.32;">
              If you did not request this, please ignore this email.
            </td>
          </tr>
        </table> <!-- /wrapper-->
      </td>
    </tr>
  </table> <!-- /body-->
</body>

</html>
